<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Order ' + ${order.orderNumber})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container my-4">
    <div class="dashboard-card mb-4">
        <div class="d-flex justify-content-between">
            <h5>Order <span th:text="${order.orderNumber}"></span></h5>
            <span class="status-badge" th:classappend="'status-' + ${order.status}" th:text="${order.status}"></span>
        </div>
        <p class="text-muted mb-0">Placed on <span th:text="${#temporals.format(order.placedAt, 'dd MMM yyyy, hh:mm a')}"></span></p>
    </div>

    <table class="table bg-white shadow-sm rounded mb-4">
        <thead><tr><th>Product</th><th>Qty</th><th>Unit Price</th><th>Subtotal</th></tr></thead>
        <tbody>
            <tr th:each="item : ${order.items}">
                <td th:text="${item.product.name}"></td>
                <td th:text="${item.quantity}"></td>
                <td th:text="'₹' + ${item.unitPrice}"></td>
                <td th:text="'₹' + ${item.subtotal}"></td>
            </tr>
        </tbody>
        <tfoot>
            <tr><th colspan="3" class="text-end">Total</th><th th:text="'₹' + ${order.totalAmount}"></th></tr>
        </tfoot>
    </table>

    <div class="dashboard-card">
        <h6>Delivery Address</h6>
        <p th:text="${order.address.recipientName + ', ' + order.address.addressLine1 + ', ' + order.address.city + ', ' + order.address.state + ' - ' + order.address.pinCode}"></p>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
