<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Manage Orders')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container my-4">
    <h4 class="mb-3">All Orders</h4>
    <table class="table bg-white shadow-sm rounded">
        <thead><tr><th>Order #</th><th>Customer</th><th>Total</th><th>Status</th><th>Date</th></tr></thead>
        <tbody>
            <tr th:each="o : ${orders}">
                <td th:text="${o.orderNumber}"></td>
                <td th:text="${o.customer.fullName}"></td>
                <td th:text="'₹' + ${o.totalAmount}"></td>
                <td><span class="status-badge" th:classappend="'status-' + ${o.status}" th:text="${o.status}"></span></td>
                <td th:text="${#temporals.format(o.placedAt, 'dd MMM yyyy')}"></td>
            </tr>
        </tbody>
    </table>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
