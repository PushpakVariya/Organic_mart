<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Server Error')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container text-center my-5">
    <i class="fa-solid fa-triangle-exclamation" style="font-size:4rem;color:#c62828;"></i>
    <h1 class="mt-3">500</h1>
    <h4>Something Went Wrong</h4>
    <p class="text-muted" th:text="${errorMessage} ?: 'An unexpected error occurred. Please try again.'"></p>
    <a th:href="@{/}" class="btn btn-organic">Back to Home</a>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
