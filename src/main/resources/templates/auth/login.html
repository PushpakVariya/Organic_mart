<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Login')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="auth-card fade-in">
    <h3 class="text-center mb-3" th:text="#{auth.login.title}">Welcome Back</h3>
    <p th:if="${successMessage}" class="alert alert-success alert-auto-dismiss" th:text="${successMessage}"></p>
    <p th:if="${param.error}" class="alert alert-danger" th:text="#{auth.login.invalid}">Invalid email or password.</p>
    <p th:if="${param.logout}" class="alert alert-info" th:text="#{auth.login.loggedOut}">You have been logged out.</p>

    <form th:action="@{/auth/login}" method="post">
        <div class="mb-3">
            <label class="form-label" th:text="#{auth.login.email}">Email</label>
            <input type="email" name="username" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label" th:text="#{auth.login.password}">Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-organic w-100" th:text="#{auth.login.submit}">Login</button>
    </form>
    <div class="text-center mt-3">
        <a th:href="@{/auth/forgot-password}" class="small" th:text="#{auth.login.forgotPassword}">Forgot Password?</a><br/>
        <span class="small" th:text="#{auth.login.newHere}">New here?</span>
        <a th:href="@{/auth/register}" th:text="#{auth.login.createAccount}">Create an account</a>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
