<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Forgot Password')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="auth-card fade-in">
    <h3 class="text-center mb-3">Forgot Password</h3>
    <p th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></p>
    <form th:action="@{/auth/forgot-password}" method="post">
        <div class="mb-3">
            <label class="form-label">Registered Email</label>
            <input type="email" name="email" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-organic w-100">Send OTP</button>
    </form>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
