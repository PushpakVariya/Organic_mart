<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Reset Password')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="auth-card fade-in">
    <h3 class="text-center mb-3">Reset Password</h3>
    <p class="text-muted text-center">OTP sent to <b th:text="${email}"></b></p>
    <p th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></p>
    <p th:if="${infoMessage}" class="alert alert-info" th:text="${infoMessage}"></p>

    <form th:action="@{/auth/reset-password}" method="post">
        <input type="hidden" name="email" th:value="${email}"/>
        <div class="mb-3">
            <label class="form-label">OTP</label>
            <input type="text" name="otp" class="form-control" maxlength="6" required>
        </div>
        <div class="mb-3">
            <label class="form-label">New Password</label>
            <input type="password" name="newPassword" class="form-control" required minlength="6">
        </div>
        <button type="submit" class="btn btn-organic w-100">Reset Password</button>
    </form>
    <form th:action="@{/auth/resend-otp}" method="post" class="mt-3 text-center">
        <input type="hidden" name="email" th:value="${email}"/>
        <input type="hidden" name="purpose" value="FORGOT_PASSWORD"/>
        <button type="submit" class="btn btn-link">Resend OTP</button>
    </form>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
