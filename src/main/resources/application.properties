spring.application.name=organicmart

# ===================== DATABASE =====================
spring.datasource.url=jdbc:mysql://localhost:3306/organicmart_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================== JPA / HIBERNATE =====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
# Keep the Hibernate session open through view rendering so Thymeleaf can
# access lazy-loaded relationships (product.category, order.customer, etc.)
# without throwing LazyInitializationException.
spring.jpa.open-in-view=true

# ===================== SERVER =====================
server.port=8080
server.error.whitelabel.enabled=false

# ===================== THYMELEAF =====================
spring.thymeleaf.cache=false

# ===================== FILE UPLOAD =====================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
app.upload.dir=uploads

# ===================== MAIL (Gmail SMTP example) =====================
# Use a Gmail App Password, not your normal password
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-16-char-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from=OrganicMart <your-email@gmail.com>

# ===================== OTP =====================
app.otp.expiry-minutes=10
app.otp.length=6
# Set to true once Gmail SMTP is configured and working.
# While false, new accounts are auto-verified (no OTP email needed) - for local testing only.
app.otp.enabled=false

# ===================== LOGGING =====================
logging.level.org.springframework.security=INFO
logging.level.com.organicmart=DEBUG
